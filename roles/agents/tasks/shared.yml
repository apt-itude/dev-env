---
- name: Finding skills managed by dev-env
  find:
    paths: "{{ role_path }}/files/skills"
    file_type: directory
  delegate_to: localhost
  become: false
  register: agents_skill_dirs

- name: Creating shared agent config directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ agents_home }}"
    - "{{ agents_home }}/rules"
    - "{{ agents_home }}/skills"
    - "{{ agents_sources_home }}"

# External skills are symlinked from a clone rather than copied, so each run's pull updates them in
# place and skill-local state (e.g. a script's virtualenv) survives between runs.
# Clones are not shallow: the git module re-fetches a shallow clone at the new tip only, which
# disconnects it from the checked-out commit and makes every upstream change look like it would
# discard local commits.
- name: Cloning external skill sources
  git:
    repo: "{{ item.value.repo }}"
    dest: "{{ agents_sources_home }}/{{ item.key }}"
    version: "{{ item.value.version | default('HEAD') }}"
  loop: "{{ agents_skill_sources | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Finding skills in external skill sources
  find:
    paths: "{{ agents_sources_home }}/{{ item.key }}/{{ item.value.path }}"
    file_type: directory
  loop: "{{ agents_skill_sources | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: agents_external_skill_dirs

- name: Checking for skill name collisions across sources
  assert:
    that: agents_skill_names | length == agents_skill_names | unique | length
    fail_msg: >-
      Skills with the same name come from more than one source:
      {{ agents_skill_names | community.general.counter | dict2items
         | selectattr('value', 'gt', 1) | map(attribute='key') | join(', ') }}
    quiet: true

- name: Installing shared agent instructions
  copy:
    src: AGENTS.md
    dest: "{{ agents_home }}/AGENTS.md"
    mode: "0644"

- name: Installing shared agent rules
  copy:
    src: "{{ item }}"
    dest: "{{ agents_home }}/rules/{{ item | basename }}"
    mode: "0644"
  loop: "{{ agents_rule_files }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Installing shared agent skills
  copy:
    src: "skills/{{ item }}"
    dest: "{{ agents_home }}/skills/"
  loop: "{{ agents_local_skill_names }}"

- name: Linking external skills
  file:
    src: "{{ item }}"
    dest: "{{ agents_home }}/skills/{{ item | basename }}"
    state: link
    force: true
  loop: "{{ agents_external_skill_paths }}"

# ~/.agents/rules and ~/.agents/skills are fully managed by this role, so anything not in the role
# is a leftover from a removed rule or skill and must not keep loading into agents.
- name: Finding installed shared rules and skills
  find:
    paths: "{{ agents_home }}/{{ item }}"
    file_type: any
    hidden: true
  loop:
    - rules
    - skills
  register: agents_installed

- name: Removing shared rules and skills no longer managed by dev-env
  file:
    path: "{{ item.1.path }}"
    state: absent
  loop: "{{ agents_installed.results | subelements('files') }}"
  loop_control:
    label: "{{ item.1.path }}"
  when: >-
    (item.1.path | basename)
    not in (agents_rule_names if item.0.item == 'rules' else agents_skill_names)

- name: Finding cloned external skill sources
  find:
    paths: "{{ agents_sources_home }}"
    file_type: directory
  register: agents_installed_sources

- name: Removing external skill sources no longer configured
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ agents_installed_sources.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: (item.path | basename) not in agents_skill_sources
