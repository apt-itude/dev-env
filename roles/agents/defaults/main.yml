---
agents_home: "{{ ansible_env.HOME }}/.agents"
agents_claude_home: "{{ ansible_env.HOME }}/.claude"
agents_codex_home: "{{ ansible_env.HOME }}/.codex"
agents_opencode_home: "{{ ansible_env.HOME }}/.config/opencode"

# Git repos to pull extra skills from, keyed by a unique source name. Every immediate subdirectory
# of `path` within the repo is installed as a skill alongside the ones bundled with this role.
#   <name>:
#     repo: git@github.com:org/repo.git
#     path: dir/containing/skills
#     version: main  # optional branch, tag or SHA; defaults to the remote HEAD
agents_skill_sources: {}
