git_config_global:
  # Diff and merge tools
  core.editor: subl -n --wait
  diff.tool: vscode
  difftool.vscode.cmd: code --new-window --wait --diff "$LOCAL" "$REMOTE"
  merge.tool: vscode
  mergetool.vscode.cmd: code --new-window --wait --merge "$LOCAL" "$REMOTE" "$BASE" "$MERGED"
  mergetool.vscode.trustExitCode: true
  mergetool.keepBackup: false

iterm2_profiles_repo: https://github.com/apt-itude/iterm2-profiles.git

ghostty_config:
  font-family: InconsolataGo Nerd Font Mono
  font-size: 18
  keybind:
    - super+shift+arrow_up=goto_split:up
    - super+shift+arrow_down=goto_split:down
    - super+shift+arrow_left=goto_split:left
    - super+shift+arrow_right=goto_split:right
    - super+arrow_right=next_tab
    - super+arrow_left=previous_tab
  tab-inherit-working-directory: false
  window-inherit-working-directory: false
  theme: iTerm2 Solarized Dark
  unfocused-split-opacity: 0.5

homebrew_formulae:
  coreutils:
  fff:
  gh:
  homeport/tap/dyff:
  htop:
  k9s:
  poetry:
  watch:
  wget:
  yq:

homebrew_casks:
  1password:
  amethyst:
  arc:
  flux:
  font-inconsolata-go-nerd-font:
  google-chrome:
  google-drive:
  hiddenbar:
  insomnia:
  notion:
  signal:
  spotify:
  sublime-text:
  ticktick:
  visual-studio-code:

zsh_aliases:
  show-files: defaults write com.apple.finder AppleShowAllFiles YES; killall Finder /System/Library/CoreServices/Finder.app
  hide-files: defaults write com.apple.finder AppleShowAllFiles NO; killall Finder /System/Library/CoreServices/Finder.app

zsh_variables:
  EDITOR: "subl -n --wait"
  KUBE_EDITOR: "subl -n --wait"

zsh_functions:
  subdiff: |
    subdiff() {
        subl -n --wait "$1" "$2" --command "sublimerge_diff_views {\"left_read_only\": true, \"right_read_only\": true}"
    }

zinit_plugins:
  apt-itude/zsh-things:
    multisrc: plugins/{macos-gnu-utils,dircolors}.zsh

macos_defaults:
  NSGlobalDomain:
    com.apple.swipescrolldirection:
      type: bool
      value: false
  com.apple.dock:
    autohide:
      type: bool
      value: true
    # Minimize apps to icon instead of near downloads
    minimize-to-application:
      type: bool
      value: true
    # Disable rearranging spaces automatically
    mru-spaces:
      type: bool
      value: false
    # Don't show recent applications
    show-recents:
      type: bool
      value: false
