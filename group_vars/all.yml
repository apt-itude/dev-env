git_config_global:
  # Common options
  user.name: Alex Thompson

  # Aliases
  alias.br: branch --list
  alias.cb: rev-parse --abbrev-ref HEAD
  alias.co: checkout
  alias.nb: "!f() { git checkout -b ${GIT_BRANCH_PREFIX}${1}; }; f"
  alias.pc: "!f() { git push --set-upstream $(git remote) $(git rev-parse --abbrev-ref HEAD); }; f"
  alias.peek: "!f() { git diff HEAD~${1:-1}; }; f"
  alias.pf: push --force-with-lease
  alias.pop: "!f() { git reset HEAD~${1:-1}; }; f"
  alias.pp: pull --prune
  alias.ri: "!f() { git rebase -i HEAD~${1:-1}; }; f"
  alias.st: status --ignore-submodules=dirty
  alias.sync: "!git pp && git wt-tidy && git tidy"
  alias.tidy: '!git branch --format ''%(refname:short) %(upstream:track)'' | awk ''$2 == "[gone]" { print $1}'' | xargs -r git branch -D'
  alias.wt-tidy: '!git fetch --prune && git worktree list --porcelain | awk ''/^worktree/{wt=$2} /^branch/{print wt, $2}'' | while read path branch; do branch=${branch#refs/heads/}; [ "$path" = "$(git rev-parse --show-toplevel)" ] && continue; git show-ref --verify --quiet refs/remotes/origin/$branch || (git worktree remove --force $path && git branch -D $branch); done'

git_ignore_patterns_global:
  - ".DS_Store"
  - "*.code-workspace"
  - ".vscode/"
  - "*.sublime-*"
  - ".python-version"
  - "__pycache__/"
  - "*.py[cod]"
  - "*$py.class"
  - ".cache/"
  - ".eggs/"
  - "*.egg-info/"
  - "dist/"
  - ".tox/"
  - ".coverage/"
  - "venv/"
  - "*.envrc"
  - ".mypy_cache"
  - ".pytest_cache"
  - "node_modules"
  - ".direnv/"
  - ".claude/settings.local.json"

zsh_aliases:
  ls: ls --color=auto
  ll: ls -lsF
  la: ls -lsaF
  grep: grep --color=auto
  cl: clear
  zup: zinit update --all

zsh_functions:
  up: |
    up() { # Go up X directories (default 1)
      if [[ "$#" -ne 1 ]]; then
        cd ..
      elif ! [[ $1 =~ '^[0-9]+$' ]]; then
        echo "Error: up should be called with the number of directories to go up. The default is 1."
      else
        local d=""
        limit=$1
        for ((i=1 ; i <= limit ; i++))
          do
            d=$d/..
          done
        d=$(echo $d | sed 's/^\///')
        cd $d
      fi
    }

  gsw: |
    gsw() {
      branch="${1}"
      worktree=$(git worktree list --porcelain \
        | awk -v branch="refs/heads/${branch}" '
            /^worktree / { path = $2 }
            /^branch /   { if ($2 == branch) print path }
          ' \
        | head -1)

      if [ -n "$worktree" ]; then
        echo "Switching to worktree: $worktree"
        cd "$worktree"
      else
        git switch "$branch"
      fi
    }

zsh_keybindings:
  "\\^U": backward-kill-line

zsh_options:
  - APPEND_HISTORY
  - EXTENDED_HISTORY
  - HIST_IGNORE_ALL_DUPS
  - HIST_IGNORE_SPACE
  - INTERACTIVE_COMMENTS

zsh_variables:
  HISTFILE: "${HOME}/.zhistory"
  HISTSIZE: 10000
  SAVEHIST: 10000
  PIP_REQUIRE_VIRTUALENV: "true"

zinit_prompt_plugins:
  romkatv/powerlevel10k:
    depth: "1"
  apt-itude/p10k-config:

zinit_snippets:
  OMZP::docker:
  OMZP::python:
  OMZP::poetry:

pyenv_versions:
  3.10.6:
    global: true

rbenv_versions:
  2.7.6:
    global: true

k9s_config:
  liveViewAutoRefresh: false
  screenDumpDir: "{{ k9s_config_dir }}/screen-dumps"
  refreshRate: 2
  maxConnRetry: 5
  readOnly: false
  noExitOnCtrlC: false
  ui:
    enableMouse: false
    headless: false
    logoless: true
    crumbsless: false
    reactive: true
    noIcons: false
    defaultsToFullScreen: false
    skin: solarized-dark
  skipLatestRevCheck: false
  disablePodCounting: false
  shellPod:
    image: busybox:1.35.0
    namespace: default
    limits:
      cpu: 100m
      memory: 100Mi
  imageScans:
    enable: false
    exclusions:
      namespaces: []
      labels: {}
  logger:
    tail: 100
    buffer: 5000
    sinceSeconds: -1
    textWrap: false
    showTime: false
  thresholds:
    cpu:
      critical: 90
      warn: 70
    memory:
      critical: 90
      warn: 70

k9s_aliases:
  dp: deployments
  sec: v1/secrets
  jo: jobs
  cr: clusterroles
  crb: clusterrolebindings
  ro: roles
  rb: rolebindings
  np: networkpolicies

k9s_plugins:
  watch-events:
    shortCut: Shift-E
    confirm: false
    description: Watch Events
    scopes:
      - all
    command: sh
    background: false
    args:
      - -c
      - "kubectl events --context $CONTEXT --namespace $NAMESPACE --for $RESOURCE_NAME.$RESOURCE_GROUP/$NAME --watch"

